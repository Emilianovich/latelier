packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5
  # schema-utils requires webpack >=5.112; Nest CLI pins an older release.
  webpack@*: 5.112.2
peerDependencyRules:
  allowedVersions:
    # Vite+ core implements Vite APIs but uses its own version number.
    vite: 1.4.0
