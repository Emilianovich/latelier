<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">L'Atelier — arquitectura self-hosted</text>
  <text x="70" y="108" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Instalación local con puertos separados, autenticación por cookie y almacenamiento S3-compatible</text>

  <rect x="55" y="145" width="395" height="560" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="85" y="190" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Cliente</text>
  <rect x="95" y="260" width="315" height="150" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="252" y="315" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Navegador</text>
  <text x="252" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Safari, Chrome, Firefox</text>
  <text x="252" y="378" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">https://localhost:3000</text>

  <rect x="500" y="145" width="410" height="560" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="530" y="190" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Aplicación</text>
  <rect x="545" y="225" width="320" height="145" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
  <text x="705" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#166534">TanStack Start</text>
  <text x="705" y="307" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Frontend</text>
  <text x="705" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">localhost:3000</text>

  <rect x="545" y="460" width="320" height="145" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
  <text x="705" y="510" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#166534">NestJS</text>
  <text x="705" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">API + autenticación</text>
  <text x="705" y="572" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">localhost:3001</text>

  <rect x="960" y="145" width="385" height="560" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="990" y="190" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Datos locales</text>
  <rect x="1005" y="225" width="295" height="135" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="3" filter="url(#shadow)"/>
  <text x="1152" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#9a3412">MongoDB</text>
  <text x="1152" y="307" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">usuarios, sesiones</text>
  <text x="1152" y="333" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">datos académicos</text>

  <rect x="1005" y="460" width="295" height="135" rx="16" fill="#ffffff" stroke="#ea580c" stroke-width="3" filter="url(#shadow)"/>
  <text x="1152" y="510" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#9a3412">MinIO</text>
  <text x="1152" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">API compatible con S3</text>
  <text x="1152" y="568" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">apuntes y evidencias</text>

  <line x1="410" y1="335" x2="545" y2="298" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="476" y="293" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">HTTPS</text>
  <line x1="705" y1="370" x2="705" y2="460" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="727" y="421" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">/api + CORS</text>
  <line x1="865" y1="510" x2="1005" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="938" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">CRUD</text>
  <line x1="865" y1="555" x2="1005" y2="525" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="932" y="550" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">S3 API</text>
  <path d="M545 570 C475 650, 250 650, 252 410" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="365" y="665" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1d4ed8">Cookie HttpOnly + Secure + SameSite=Lax</text>

  <rect x="70" y="750" width="1260" height="42" rx="12" fill="#e2e8f0"/>
  <text x="700" y="777" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">Todos los servicios corren en Docker Compose; MongoDB y MinIO persisten mediante volúmenes locales.</text>
</svg>
